<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <script src="signup.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a href="index.html" aria-label="Matador Hunt home">
            <img src="CSUNS.svg.webp" alt="CSUN logo" width="42" height="42">
            <span>MATADOR <b>HUNT</b></span>
        </a>
        <p class="header-note">Six riddles. One hunt.</p>
    </header>

    <main class="signup-layout">
        <div class="login-card">
            <span class="intro-text">JOIN THE HUNT</span>
            <h2>Create your account</h2>

            <form id="signupForm">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Your username"
                    minlength="5"
                    maxlength="24"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 8 characters"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <label for="confirmPassword">Confirm password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    autocomplete="new-password"
                    required
                >

                <button type="submit" class="button-acc">
                    Create account
                </button>

                <p id="message" role="status"></p>
            </form>

            <a href="index.html">Back to login</a>
        </div>
    </main>
</body>
</html>
